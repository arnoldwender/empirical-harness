name: gate

# The Empirical Harness runs its own falsifier on every push. A repo whose
# thesis is "a rule you cannot test is a belief" cannot ship an untested rule.
#
# No step interpolates untrusted input into a shell. The only expression here is
# `github.event_name` inside an `if:`, which never reaches a `run:`.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, with --online. Link rot in a source URL is not a reason to block a
    # commit that never touched the link, but it IS something to find out about
    # before a reader does.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  citations:
    name: citation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: Self-check (the repo keeps its own promises)
        run: python3 scripts/check.py

      - name: Citation gate
        run: python3 gate/citations.py --sarif citations.sarif

      - name: Citation gate, online (scheduled runs only)
        if: github.event_name == 'schedule'
        run: python3 gate/citations.py --online

      - name: Mutation check (do the tests defend the citation gate?)
        run: python3 tests/mutation_check_citations.py

      # The order gate judges a SESSION, and there is no session in CI. So this
      # job does not pretend to judge one: it proves the gate still has teeth,
      # against a sample log that must pass and a planted defect that must not.
      # The gate is report-only by design; what can fail this job is the gate
      # being broken, never somebody's reading habits.
      - name: Mutation check (do the tests defend the order gate?)
        run: python3 tests/mutation_check_read_order.py

      - name: Order gate, against a sample log it has to pass
        run: python3 gate/read_order.py --toollog gate/sample-toollog.jsonl --sarif read-order.sarif

      # A gate nobody has watched go red is a belief. An edit ahead of its read
      # must come back 1 — not 0 (fails open) and not 2 (the gate itself broke).
      - name: The falsifier — an edit ahead of its read must be REJECTED
        run: |
          printf '%s\n' \
            '{"op": "edit", "path": "gate/citations.py"}' \
            '{"op": "read", "path": "gate/citations.py", "start": 1, "lines": 687, "total": 687}' \
            > planted-toollog.jsonl
          set +e
          python3 gate/read_order.py --toollog planted-toollog.jsonl
          code=$?
          set -e
          rm -f planted-toollog.jsonl
          if [ "$code" -ne 1 ]; then
            echo "the gate returned $code for an edit ahead of its read; expected 1" >&2
            exit 1
          fi
          echo "the gate rejected the edit that came before its read, as it must"

      # The live hook is the order gate at the moment of the edit. Same rule as
      # above: CI cannot run a session, so it proves the hook still has teeth —
      # its mutants die, and a planted partial read ahead of an edit is warned about.
      - name: Mutation check (do the tests defend the live hook?)
        run: python3 tests/mutation_check_read_before_edit.py

      - name: The live hook — a partial read ahead of an edit must be WARNED about
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile
          d = tempfile.mkdtemp()
          target = os.path.join(d, "planted.py")
          with open(target, "w") as fh:
              fh.write("".join(f"line {i}\n" for i in range(1, 201)))
          rows = [
              {"type": "assistant", "timestamp": "2099-01-01T00:00:00.000Z", "message": {"role": "assistant",
               "content": [{"type": "tool_use", "id": "t1", "name": "Read", "input": {"file_path": target, "limit": 20}}]}},
              {"type": "user", "timestamp": "2099-01-01T00:00:01.000Z", "message": {"role": "user",
               "content": [{"type": "tool_result", "tool_use_id": "t1", "content": "x"}]},
               "toolUseResult": {"type": "text", "file": {"filePath": target, "numLines": 20, "startLine": 1, "totalLines": 201}}},
          ]
          transcript = os.path.join(d, "session.jsonl")
          with open(transcript, "w") as fh:
              fh.write("".join(json.dumps(r) + "\n" for r in rows))
          payload = {"session_id": "ci", "transcript_path": transcript, "cwd": d, "hook_event_name": "PreToolUse",
                     "tool_name": "Edit", "tool_input": {"file_path": target, "old_string": "a", "new_string": "b"}}
          r = subprocess.run([sys.executable, "hooks/read-before-edit.py"], input=json.dumps(payload),
                             capture_output=True, text=True, env={**os.environ, "READ_ORDER_RECEIPTS": "off"})
          out = json.loads(r.stdout) if r.stdout.strip() else {}
          text = (out.get("hookSpecificOutput") or {}).get("additionalContext", "")
          if r.returncode != 0 or "20 of 200 lines" not in text:
              print(f"the hook returned {r.returncode} and said {text!r}; expected a warning about 20 of 200 lines", file=sys.stderr)
              sys.exit(1)
          print("the hook warned about the partial read, as it must:", text[:80])
          PY

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citations-sarif
          path: citations.sarif
          if-no-files-found: ignore

      - name: Upload order-gate SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-order-sarif
          path: read-order.sarif
          if-no-files-found: ignore
