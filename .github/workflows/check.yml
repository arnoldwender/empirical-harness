# The codex in this repo says "done is what the gates return". This is that gate.
# scripts/check.py verifies the repo against its own claims: that the emitter runs and
# prints a real line, that the paste-ready block is plain text and matches CODEX.md
# byte for byte, that every quoted line exists in the pool, and that no link is dead.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


concurrency:
  # Un push nuevo sobre la misma rama cancela el CI del anterior: sin esto, una
  # tanda de commits paga N ejecuciones y solo la última importa.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  check:
    # Corria en `self-hosted`. Medido 2026-09-10: cero runners registrados en
    # GitHub y ninguno en la maquina. Un check requerido que solo corre en un
    # runner inexistente no es un gate: es una rama incommiteable. La cuota de
    # Actions, que fue la razon original, ya no es el problema.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check.py
